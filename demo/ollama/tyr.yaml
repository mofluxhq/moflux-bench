version: 1

server:
  port: 8787
  maxRequestBodyBytes: 1048576
  maxOutputTokens: 1024

upstreams:
  # The only upstream. It resolves on the compose network to the `ollama`
  # service in this file and has no route off the host, so this stack cannot
  # reach a paid provider even if a caller sends a hosted model name.
  openai:
    baseUrl: http://ollama:11434

timeouts:
  # A local server is slower to first token than a hosted one and much more
  # variable: the first request after a cold start pays for loading the weights
  # into memory. These are deliberately looser than demo/openai/tyr.yaml so a
  # cold load is measured rather than timed out and recorded as a failure.
  responseHeadersMs: 300000
  streamIdleMs: 120000
  clientStallMs: 120000

shutdown:
  drainTimeoutMs: 30000

# Local benchmark-only trust boundary. The demo sends x-priority directly.
priority:
  trustHeader: true

telemetry:
  metrics:
    enabled: true
  audit:
    enabled: false

pools:
  - name: local-inference
    # Prefixes of the small open-weight families this benchmark is expected to
    # be pointed at. A model outside them is not silently admitted to this pool.
    modelPrefixes: [qwen, llama, gemma, phi, mistral, smollm, deepseek, granite]
    # A tokenizer proxy, not a claim about the served model. No local family's
    # tokenizer is bundled here, so the pool starts from a GPT-4o estimate and
    # `adaptiveEstimation` below corrects it from the usage the server actually
    # reports. Treat the first `minSamples` requests of a run as warm-up.
    estimatorModel: gpt-4o
    # Matched to OLLAMA_NUM_PARALLEL=1 in compose.yaml. The admission bound has
    # to be the server's real concurrency or Tyr would be shedding against an
    # imaginary capacity, and `maxQueue: 0` keeps every rejection attributable
    # to admission rather than to time spent waiting in a queue.
    maxConcurrent: 1
    maxQueue: 0
    admissionMode: enforce
    inFlightTokenBudget: 8192
    defaultOutputReservation: 64
    adaptiveEstimation:
      enabled: true
      smoothing: 0.2
      minSamples: 5
      minCorrection: 0.5
      maxCorrection: 2
      maxModels: 16
    progressiveReconciliation:
      enabled: true
      updateStepTokens: 64
      outputSafetyMarginTokens: 64
