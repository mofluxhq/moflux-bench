version: 1

server:
  port: 8787
  maxRequestBodyBytes: 67108864
  maxOutputTokens: 200000

upstreams:
  openai:
    baseUrl: http://host.docker.internal:9000
  anthropic:
    baseUrl: http://host.docker.internal:9000

timeouts:
  responseHeadersMs: 30000
  streamIdleMs: 30000
  clientStallMs: 30000

shutdown:
  drainTimeoutMs: 30000

# The benchmark load generator sends x-priority directly.
# This is acceptable only for this local, controlled benchmark.
priority:
  trustHeader: true

telemetry:
  metrics:
    enabled: true
  audit:
    enabled: false

pools:
  - name: sim-interactive
    modelPrefixes: [sim-model-interactive]
    estimatorModel: gpt-4o
    maxConcurrent: 0
    maxQueue: 0
    limitsRevision: 0
    admissionMode: enforce
    inFlightTokenBudget: 0
    defaultOutputReservation: 2048
    adaptiveEstimation:
      enabled: true
      smoothing: 0.2
      minSamples: 5
      minCorrection: 0.5
      maxCorrection: 2
      maxModels: 16
    progressiveReconciliation:
      enabled: true
      updateStepTokens: 256
      outputSafetyMarginTokens: 256


  - name: sim-batch
    modelPrefixes: [sim-model-batch]
    estimatorModel: gpt-4o
    maxConcurrent: 0
    maxQueue: 0
    limitsRevision: 0
    admissionMode: enforce
    inFlightTokenBudget: 0
    defaultOutputReservation: 2048
    adaptiveEstimation:
      enabled: true
      smoothing: 0.2
      minSamples: 5
      minCorrection: 0.5
      maxCorrection: 2
      maxModels: 16
    progressiveReconciliation:
      enabled: true
      updateStepTokens: 256
      outputSafetyMarginTokens: 256

routing:
  capacityAware:
    instanceId: tyr-r4
    sharedSecretEnv: TYR_ROUTING_SECRET
    pollIntervalMs: 100
    staleAfterMs: 1000
    probeTimeoutMs: 250
    forwardTimeoutMs: 30000
    peers:
      - id: tyr-r1
        baseUrl: http://tyr-r1:8787
      - id: tyr-r2
        baseUrl: http://tyr-r2:8787
      - id: tyr-r3
        baseUrl: http://tyr-r3:8787

controlPlane:
  type: latchflo
  url: http://latchflo:8080
  instanceId: tyr-r4
  pools: [sim-interactive, sim-batch]
  bootstrapTokenEnv: LATCHFLO_AGENT_BOOTSTRAP_TOKEN
  agentTokenFile: /var/lib/tyr/latchflo-agent.token
  retryIntervalMs: 500
  retryMaxIntervalMs: 5000
  requestTimeoutMs: 3000
  metadata:
    region: local
    zone: demo-4
    version: 0.24.0
    endpoint: http://tyr-r4:8787
    labels:
      environment: benchmark
