version: 1

server:
  port: 8787
  maxRequestBodyBytes: 67108864
  maxOutputTokens: 200000

upstreams:
  openai:
    baseUrl: http://host.docker.internal:9000
  anthropic:
    baseUrl: http://host.docker.internal:9000

timeouts:
  responseHeadersMs: 30000
  streamIdleMs: 30000
  clientStallMs: 30000

shutdown:
  drainTimeoutMs: 30000

priority:
  trustHeader: false

identity:
  jwt:
    jwksUrl: https://host.docker.internal:9010/jwks
    issuer: https://moflux-bench.local/
    audience: moflux-bench
    header: x-tyr-identity-token
    algorithms: [RS256]
    claims:
      subject: sub
      tenantId: tenant_id
      applicationId: azp
      roles: roles
  roles:
    invoke: [tyr.invoke]
    operator: [tyr.operator]

telemetry:
  metrics:
    enabled: true
  audit:
    enabled: false

pools:
  - name: sim-shared
    modelPrefixes: [sim-model-shared]
    estimatorModel: gpt-4o
    maxConcurrent: 0
    maxQueue: 0
    limitsRevision: 0
    admissionMode: enforce
    inFlightTokenBudget: 0
    defaultOutputReservation: 2048
    adaptiveEstimation:
      enabled: true
      smoothing: 0.2
      minSamples: 5
      minCorrection: 0.5
      maxCorrection: 2
      maxModels: 16
    progressiveReconciliation:
      enabled: true
      updateStepTokens: 256
      outputSafetyMarginTokens: 256

  - name: sim-ceilings
    modelPrefixes: [sim-model-ceilings]
    estimatorModel: gpt-4o
    maxConcurrent: 0
    maxQueue: 0
    limitsRevision: 0
    admissionMode: enforce
    inFlightTokenBudget: 0
    defaultOutputReservation: 2048
    adaptiveEstimation:
      enabled: true
      smoothing: 0.2
      minSamples: 5
      minCorrection: 0.5
      maxCorrection: 2
      maxModels: 16
    progressiveReconciliation:
      enabled: true
      updateStepTokens: 256
      outputSafetyMarginTokens: 256
    admissionClasses:
      defaultClass: noisy
      classes:
        premium:
          protectedConcurrent: 0
          maxConcurrent: 0
          protectedInFlightTokens: 0
          maxInFlightTokens: 0
        noisy:
          protectedConcurrent: 0
          maxConcurrent: 0
          protectedInFlightTokens: 0
          maxInFlightTokens: 0
      rules:
        - admissionClass: premium
          tenantIds: [tenant-premium]

  - name: sim-protected
    modelPrefixes: [sim-model-protected]
    estimatorModel: gpt-4o
    maxConcurrent: 0
    maxQueue: 0
    limitsRevision: 0
    admissionMode: enforce
    inFlightTokenBudget: 0
    defaultOutputReservation: 2048
    adaptiveEstimation:
      enabled: true
      smoothing: 0.2
      minSamples: 5
      minCorrection: 0.5
      maxCorrection: 2
      maxModels: 16
    progressiveReconciliation:
      enabled: true
      updateStepTokens: 256
      outputSafetyMarginTokens: 256
    admissionClasses:
      defaultClass: noisy
      classes:
        premium:
          protectedConcurrent: 0
          maxConcurrent: 0
          protectedInFlightTokens: 0
          maxInFlightTokens: 0
        noisy:
          protectedConcurrent: 0
          maxConcurrent: 0
          protectedInFlightTokens: 0
          maxInFlightTokens: 0
      rules:
        - admissionClass: premium
          tenantIds: [tenant-premium]
routing:
  capacityAware:
    instanceId: tyr-r1
    sharedSecretEnv: TYR_ROUTING_SECRET
    pollIntervalMs: 100
    staleAfterMs: 1000
    probeTimeoutMs: 250
    forwardTimeoutMs: 30000
    peers:
      - id: tyr-r2
        baseUrl: http://tyr-r2:8787
      - id: tyr-r3
        baseUrl: http://tyr-r3:8787
      - id: tyr-r4
        baseUrl: http://tyr-r4:8787

controlPlane:
  type: latchflo
  url: http://latchflo:8080
  instanceId: tyr-r1
  pools: [sim-shared, sim-ceilings, sim-protected]
  bootstrapTokenEnv: LATCHFLO_AGENT_BOOTSTRAP_TOKEN
  agentTokenFile: /var/lib/tyr/latchflo-agent.token
  retryIntervalMs: 500
  retryMaxIntervalMs: 5000
  requestTimeoutMs: 3000
  metadata:
    region: local
    zone: demo-classes
    version: 0.22.0
    endpoint: http://tyr-r1:8787
    labels:
      environment: benchmark
      scenario: tenant-fairness
