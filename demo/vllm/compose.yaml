# GPU-backed contention stack. The runner recreates `vllm` before every arm,
# changing only its scheduling policy (`fcfs` or `priority`). Model weights live
# in an external cache volume so a clean control plane never means a re-download.

x-tyr-arm: &tyr-arm
  image: ${MOFLUX_TYR_IMAGE:?Set MOFLUX_TYR_IMAGE}
  restart: "no"
  user: "${MOFLUX_TYR_USER:-0:0}"
  environment:
    TYR_CONFIG_FILE: /etc/tyr/config.yaml
    LATCHFLO_AGENT_BOOTSTRAP_TOKEN: ${LATCHFLO_AGENT_BOOTSTRAP_TOKEN:?Set LATCHFLO_AGENT_BOOTSTRAP_TOKEN}
    NODE_EXTRA_CA_CERTS: /etc/tyr/benchmark-ca.pem
  depends_on:
    vllm:
      condition: service_healthy
    latchflo:
      condition: service_healthy
  extra_hosts:
    - "host.docker.internal:host-gateway"
  healthcheck:
    test:
      - CMD
      - node
      - -e
      - >-
        fetch('http://127.0.0.1:8787/healthz')
        .then(response => { if (!response.ok) process.exit(1); })
        .catch(() => process.exit(1))
    interval: 1s
    timeout: 2s
    start_period: 2s
    retries: 60

services:
  vllm:
    image: ${MOFLUX_VLLM_IMAGE:?Set MOFLUX_VLLM_IMAGE}
    restart: "no"
    ipc: host
    command:
      - --model
      - ${MOFLUX_VLLM_MODEL:?Set MOFLUX_VLLM_MODEL}
      - --served-model-name
      - ${MOFLUX_VLLM_SERVED_MODEL:-moflux-vllm}
      - --revision
      - ${MOFLUX_VLLM_MODEL_REVISION:?Set MOFLUX_VLLM_MODEL_REVISION}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-num-seqs
      - "4"
      - --max-model-len
      - "4096"
      - --gpu-memory-utilization
      - "${MOFLUX_VLLM_GPU_MEMORY_UTILIZATION:-0.85}"
      - --scheduling-policy
      - ${MOFLUX_VLLM_SCHEDULING_POLICY:-priority}
      - --no-enable-prefix-caching
    environment:
      HF_HOME: /root/.cache/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    ports:
      - "127.0.0.1:18000:8000"
    volumes:
      - vllm-hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # Use the same host GPU the runner samples with nvidia-smi.
              # `count: 1` would let Docker choose a different GPU on a
              # multi-GPU host and silently join two machines' measurements.
              device_ids: ["${MOFLUX_VLLM_GPU_DEVICE:-0}"]
              capabilities: [gpu]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 2s
      timeout: 3s
      start_period: 30s
      retries: 180

  latchflo:
    image: ${MOFLUX_LATCHFLO_IMAGE:?Set MOFLUX_LATCHFLO_IMAGE}
    restart: "no"
    environment:
      LATCHFLO_HOST: 0.0.0.0
      LATCHFLO_PORT: "8080"
      LATCHFLO_DATABASE_PATH: /app/data/latchflo-control-plane.db
      LATCHFLO_ADMIN_TOKEN: ${LATCHFLO_ADMIN_TOKEN:?Set LATCHFLO_ADMIN_TOKEN}
      LATCHFLO_AGENT_BOOTSTRAP_TOKEN: ${LATCHFLO_AGENT_BOOTSTRAP_TOKEN:?Set LATCHFLO_AGENT_BOOTSTRAP_TOKEN}
      LATCHFLO_HEARTBEAT_INTERVAL_MS: "500"
      LATCHFLO_POLL_INTERVAL_MS: "250"
      LATCHFLO_AGENT_TIMEOUT_MS: "8000"
      LATCHFLO_RECONCILE_INTERVAL_MS: "250"
    ports:
      - "127.0.0.1:18086:8080"
    volumes:
      - vllm-latchflo-data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:8080/readyz')
          .then(response => { if (!response.ok) process.exit(1); })
          .catch(() => process.exit(1))
      interval: 1s
      timeout: 2s
      start_period: 3s
      retries: 60

  tyr-static:
    <<: *tyr-arm
    ports: ["127.0.0.1:18125:8787"]
    volumes:
      - ./tyr-static.yaml:/etc/tyr/config.yaml:ro
      - ./runtime/ca.pem:/etc/tyr/benchmark-ca.pem:ro
      - vllm-tyr-static-data:/var/lib/tyr

  tyr-moflux:
    <<: *tyr-arm
    ports: ["127.0.0.1:18126:8787"]
    volumes:
      - ./tyr-moflux.yaml:/etc/tyr/config.yaml:ro
      - ./runtime/ca.pem:/etc/tyr/benchmark-ca.pem:ro
      - vllm-tyr-moflux-data:/var/lib/tyr

volumes:
  vllm-hf-cache:
    external: true
    name: moflux-bench-vllm-hf-cache
  vllm-latchflo-data:
  vllm-tyr-static-data:
  vllm-tyr-moflux-data:
